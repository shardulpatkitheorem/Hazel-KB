<script>
(function(){
"use strict";
const STAGES=["Interest Received","Private RAFA Review","Invitation Sent","Registration","NDA","Due Diligence","Risk Questions","Hazel Review","Review Complete"];
const MEMBER_STAGES=["Eligibility","Registration","NDA","Due Diligence","Risk Questions","Hazel Review"];
const CASES=[
 {id:"new",name:"Public inquiry",view:"public",screen:"landing",stage:0,rafa:"Pending",invite:"valid",nda:"NOT_STARTED",ndaDone:false,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"invited",name:"Invitation sent",view:"public",screen:"invitation",stage:2,rafa:"Eligible · composite 2",invite:"valid",nda:"NOT_STARTED",ndaDone:false,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"nda-awaiting",name:"NDA awaiting signature",view:"member",screen:"nda",stage:4,rafa:"Eligible · composite 1",invite:"accepted",nda:"READY_TO_SIGN",ndaDone:false,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"nda-signing",name:"NDA signing in progress",view:"member",screen:"nda",stage:4,rafa:"Eligible · composite 1",invite:"accepted",nda:"PARTIALLY_SIGNED",ndaDone:false,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"nda-complete",name:"NDA completed / documents required",view:"member",screen:"member-dashboard",stage:5,rafa:"Eligible · composite 2",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"diligence",name:"Due Diligence in progress",view:"member",screen:"due-diligence",stage:5,rafa:"Eligible · composite 2",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:false,riskDone:false,outcome:"Pending"},
 {id:"risk",name:"Risk Questions in progress",view:"member",screen:"risk-questions",stage:6,rafa:"Eligible · composite 2",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:true,riskDone:false,outcome:"Pending"},
 {id:"submitted",name:"Submitted / Under Hazel review",view:"member",screen:"review-status",stage:7,rafa:"Eligible · composite 1",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:true,riskDone:true,outcome:"Under Hazel review"},
 {id:"additional",name:"Additional information required",view:"member",screen:"clarification",stage:7,rafa:"Eligible · composite 2",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:true,riskDone:true,outcome:"Additional information required"},
 {id:"complete",name:"Review complete",view:"member",screen:"review-status",stage:8,rafa:"Eligible · composite 1",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:true,riskDone:true,outcome:"Review complete"},
 {id:"deferred",name:"Declined / Deferred",view:"operator",screen:"ops-queue",stage:8,rafa:"Decline/defer · composite 5",invite:"invalid",nda:"NOT_STARTED",ndaDone:false,ddDone:false,riskDone:false,outcome:"Declined / Deferred"}
];
const QUESTIONS=[
 {name:"Institution Profile & Contacts",desc:"Confirm public-record identity details, contacts, intended use, and integration election.",qs:[
  {id:"profile",text:"Is your institution’s key information correct as pre-filled from public records?",type:"radio",opts:["Yes","No"],required:true},
  {id:"dba",text:"List any trade names or DBAs under which network-facing products will be offered, or attest none.",type:"radio",opts:["Disclosure provided","None to disclose"],comment:true,required:true},
  {id:"contacts",text:"Provide the primary business, BSA, security, finance, and IT contacts.",type:"contacts",required:true},
  {id:"use",text:"Describe the institution’s intended use of Hazel services.",type:"textarea",required:true}]},
 {name:"Financial Condition Certification (CFO)",desc:"Officer certification closes the gap between the latest public filing and today.",qs:[
  {id:"funds",text:"State the source of funds for the settlement account.",type:"text",required:true},
  {id:"capital",text:"What is the institution’s current capital category under the Prompt Corrective Action framework?",type:"radio",opts:["Well Capitalized","Adequately Capitalized","Undercapitalized or below"],required:true,review:true},
  {id:"directive",text:"The institution is not subject to any capital directive or capital restoration plan.",type:"radio",opts:["Yes","No"],required:true,review:true}]},
 {name:"Compliance Questionnaire (BSA Officer)",desc:"Focused compliance attestations and two narrow supporting artifacts.",qs:[
  {id:"bsa",text:"Upload evidence that the current BSA/AML/OFAC policy was Board approved and reviewed within the last 12 months.",type:"textarea",required:true,upload:true},
  {id:"cbd",text:"Upload the completed and signed Wolfsberg CBDDQ.",type:"textarea",required:true,upload:true},
  {id:"testing",text:"Summarize the conclusion of the most recent independent BSA/AML test.",type:"textarea",required:true,comment:true}]},
 {name:"Program Certification & Disclosures",desc:"Outside programs, enforcement history, relevant litigation, and regulator notification.",qs:[
  {id:"programs",text:"Does another program or third party rely on the institution’s Hazel network access?",type:"radio",opts:["Yes","No"],required:true,comment:true},
  {id:"enforcement",text:"Disclose any relevant public enforcement action or certify none.",type:"radio",opts:["Disclosure provided","None to disclose"],required:true,comment:true}]},
 {name:"Security & Operations Attestations",desc:"Attestations from information security and operations leadership.",qs:[
  {id:"mfa",text:"Are named accounts protected by multi-factor authentication and role-based access?",type:"radio",opts:["Yes","No","Not applicable"],required:true},
  {id:"resilience",text:"Describe business-continuity and incident-escalation ownership.",type:"textarea",required:true}]},
 {name:"Insurance",desc:"Financial institution bond, cyber liability, and professional liability coverage.",qs:[
  {id:"insurance",text:"Confirm current applicable insurance coverage and provide certificate information.",type:"radio",opts:["Current coverage confirmed","Renewal in progress","Other"],required:true,upload:true},
  {id:"broker",text:"Provide the insurance broker contact.",type:"contacts",required:true}]},
 {name:"Network Responsibility Acknowledgments",desc:"CEO and BSA Officer acknowledgment of member-bank and network responsibilities.",qs:[
  {id:"ack",text:"The institution acknowledges the documented division of compliance, operating, escalation, and monitoring responsibilities.",type:"radio",opts:["Acknowledge","Request clarification"],required:true,review:true},
  {id:"certify",text:"Authorized officers certify that the final responses are complete and accurate.",type:"check",required:true}]}
];
const DD_SECTIONS=[
 {name:"Institution Details",desc:"Confirm public-record identity information and provide relationship context.",fields:[["legalName","Legal institution name","confirm","Northstar Community Bank, N.A."],["fdicDd","FDIC certificate number","confirm","12001"],["institutionWebsite","Institution website","url","https://northstar.example"],["institutionDescription","Institution description","textarea",""] ,["headquarters","Headquarters address","text","100 Market Square, Richmond, VA"],["mailing","Mailing address, if different","text",""] ,["regulator","Primary regulator","select",["OCC","Federal Reserve","FDIC","State regulator","Other"]],["domestic","Domestic or foreign institution","select",["Domestic","Foreign"]],["trustUrl","Trust center URL, if available","url",""]]},
 {name:"Primary Contacts",desc:"Identify the people responsible for onboarding, security, compliance, and operations.",fields:[["primaryContact","Primary onboarding contact","text","Jamie Chen"],["primaryTitle","Primary contact title","text","Chief Operating Officer"],["primaryEmail","Primary contact email","email","jamie.chen@northstar.example"],["secondaryContact","Secondary contact","text",""] ,["securityEmail","Security contact email","email","security@northstar.example"],["bsaContact","BSA/AML contact","text","Morgan Ellis · bsa@northstar.example"],["operationsContact","Operations contact","text","Jordan Lee · operations@northstar.example"]]},
 {name:"Initial Documents",desc:"Possible initial documents; final list requires Vantage confirmation.",fields:[["orgProfile","Institution overview or organizational profile","uploadOptional",""] ,["trustOverview","Trust center / security overview","uploadOptional",""] ,["agreement","Existing relevant agreement","uploadConditional",""] ,["otherSupport","Other supporting document","uploadOptional",""]]},
 {name:"Review and Submit",desc:"Review draft fields, sources, and optional omissions before submission.",fields:[]}
];
const PACKAGES=["Signature Card","Resolution / RESO","Wire Agreement","E-Docs Disclosure","All-in-One Terms and Conditions","Hazel Membership Agreement","Hazel Security Procedures"];
const PROVISION=["Tenant request","Hazel Bank Console access","RBAC roles","Operating accounts","Program and account limits","Sardine setup","Custodia wallet","Posting-file folder","Provisioning validation"];
const TRAINING=["Bank Console training","User-guide acknowledgment","Certification plan","Test users confirmed","Production penny test","Posting-file validation","Balance and reconciliation validation","Escalation-path acknowledgment","Support / SLA acknowledgment"];
const GO_LIVE=["Tenant enabled","RBAC verified","Console access verified","Accounts seeded","Reconciliation complete","Posting file validated","Monitoring confirmed","Escalation paths confirmed","Required sign-offs complete"];
const defaultState=()=>({version:2,view:"public",caseId:"new",screen:"landing",stage:0,questionSection:0,ddSection:0,responses:{},ddData:{},uploads:{},ndaStatus:"NOT_STARTED",ndaCompleted:false,ndaCompletedAt:"",signStep:0,dueDiligenceSubmitted:false,riskQuestionsSubmitted:false,caseTab:"overview",notes:[],audit:[{time:"Today, 9:14 AM",action:"Synthetic case created",actor:"Hazel prototype"}],outcome:"Pending"});
let state=load();
function load(){try{const saved=JSON.parse(localStorage.getItem("hazel-client-prototype")||"{}");return saved.version===2?Object.assign(defaultState(),saved):defaultState()}catch(e){return defaultState()}}
function save(){localStorage.setItem("hazel-client-prototype",JSON.stringify(state))}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function currentCase(){return CASES.find(c=>c.id===state.caseId)||CASES[0]}
function status(text,tone){return '<span class="status '+(tone||'')+'">'+esc(text)+'</span>'}
function btn(label,action,kind,disabled){return '<button type="button" class="btn '+(kind||'')+'" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function card(title,body,cls){return '<section class="card '+(cls||'')+'"><h2>'+esc(title)+'</h2>'+body+'</section>'}
function head(kicker,title,copy,action){return '<header class="page-head"><div><p class="eyebrow">'+esc(kicker)+'</p><h1>'+esc(title)+'</h1><p>'+esc(copy)+'</p></div>'+(action||'')+'</header>'}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2400)}
function modal(title,body,actions){const root=document.getElementById("modal-root");root.innerHTML='<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()"><h2 id="modal-title">'+esc(title)+'</h2>'+body+'<div class="actions">'+(actions||btn("Close","close-modal","secondary"))+'</div></div></div>';root.querySelectorAll("[data-action]").forEach(el=>el.onclick=e=>{if(el.classList.contains('modal-backdrop')&&e.target!==el)return;handle(el.dataset.action,el)});setTimeout(()=>document.querySelector(".modal button,.modal input")?.focus(),0)}
function closeModal(){document.getElementById("modal-root").innerHTML=""}
function guardRoute(screen,notify){const future=["account-setup","prelim","provisioning","training","go-live","live"],ndaProtected=["due-diligence","risk-questions","review-submit","review-status","clarification"];if(future.includes(screen)){if(notify)toast("This client prototype ends at Hazel review.");return state.riskQuestionsSubmitted?"review-status":"member-dashboard"}if(ndaProtected.includes(screen)&&!state.ndaCompleted){if(notify)toast("Complete the NDA before continuing.");return "nda"}if(["risk-questions","review-submit","review-status","clarification"].includes(screen)&&!state.dueDiligenceSubmitted){if(notify)toast("Complete Due Diligence before starting Risk Questions.");return "due-diligence"}if(screen==="review-status"&&!state.riskQuestionsSubmitted){if(notify)toast("Submit Risk Questions before starting Hazel review.");return "risk-questions"}return screen}
function navigate(screen,view,stage){const guarded=guardRoute(screen,true);state.screen=guarded;if(view)state.view=view;if(stage!==undefined)state.stage=stage;save();location.hash=guarded;render();scrollTo(0,0)}
function controls(){const c=currentCase();document.getElementById("prototype-controls").innerHTML='<div class="prototype-bar" aria-label="Prototype controls"><strong>Prototype controls</strong><div class="prototype-field"><label for="view-select">View</label><select id="view-select"><option value="public" '+(state.view==='public'?'selected':'')+'>Public</option><option value="member" '+(state.view==='member'?'selected':'')+'>Member Bank</option><option value="operator" '+(state.view==='operator'?'selected':'')+'>Hazel Operator</option></select></div><div class="prototype-field"><label for="case-select">Demo case</label><select id="case-select">'+CASES.map(x=>'<option value="'+x.id+'" '+(x.id===state.caseId?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><span class="prototype-stage">Current stage: <b>'+esc(STAGES[state.stage]||"Interest")+'</b></span><span class="prototype-spacer"></span><button class="proto-btn" data-action="prev-stage">← Previous</button><button class="proto-btn" data-action="next-stage">Next →</button><button class="proto-btn" data-action="reset">Reset</button></div>'}
function brand(operator){return '<header class="topbar"><a class="brand" href="../../index.html" aria-label="Return to prototype review hub"><img class="brand-logo" src="../../hub-assets/brand/hazel-network-logo.svg" alt="" width="95" height="78"></a><span class="spacer"></span><span class="bank-chip">'+(operator?'Internal workspace':'Northstar Community Bank')+'</span><span class="avatar">'+(operator?'AM':'JC')+'</span></header>'}
const memberNav=[["member-dashboard","Overview"],["nda","NDA"],["due-diligence","Due Diligence"],["risk-questions","Risk Questions"],["documents","Documents"]];
const opsNav=[["ops-dashboard","Pipeline"],["ops-queue","Interest & RAFA"],["ops-case","Case workspace"]];
function shell(content,operator){const items=operator?opsNav:memberNav;return '<div class="shell">'+brand(operator)+'<aside class="sidebar '+(operator?'operator':'')+'"><p class="side-label">'+(operator?'Operations':'Onboarding')+'</p>'+items.map(x=>{const ndaLock=!operator&&["due-diligence","risk-questions"].includes(x[0])&&!state.ndaCompleted,riskLock=!operator&&x[0]==="risk-questions"&&!state.dueDiligenceSubmitted,locked=ndaLock||riskLock,message=ndaLock?"Complete the NDA before continuing.":"Complete Due Diligence before starting Risk Questions.";return '<a class="nav '+(state.screen===x[0]?'active ':'')+(locked?'locked':'')+'" '+(locked?'data-locked="'+message+'"':'data-nav="'+x[0]+'"')+'><i></i><span>'+x[1]+'</span></a>'}).join('')+'<div class="side-foot">Stakeholder prototype<br>Synthetic data only</div></aside><main id="main" class="page">'+content+'</main></div>'}
function publicHeader(){return '<header class="public-head"><a class="brand" href="../../index.html" aria-label="Return to prototype review hub"><img class="brand-logo" src="../../hub-assets/brand/hazel-network-logo.svg" alt="" width="95" height="78"></a><nav><button data-nav="landing">How Hazel works</button><button data-nav="invitation">Already invited?</button><button class="btn primary" data-nav="interest">Express interest</button></nav></header>'}
function landing(){return '<div class="public">'+publicHeader()+'<main id="main"><section class="hero"><div><p class="eyebrow">Bank-led digital money</p><h1>Move money forward, with banks at the center.</h1><p>Hazel helps regulated financial institutions participate in modern payment infrastructure through one coordinated, bank-operated network.</p><div class="actions">'+btn("Express interest →","nav:interest","primary")+btn("I have an invitation","nav:invitation","secondary")+'</div></div><div class="hero-art" aria-hidden="true"></div></section><section class="benefits"><p class="eyebrow">A coordinated path to launch</p><h2>One Hazel experience from interest to production.</h2><div class="grid grid-3">'+card("Bank-first onboarding",'<p class="sub">Eligibility, due diligence, account setup, technical readiness, and launch are presented as one coherent journey.</p>')+card("Clear responsibilities",'<p class="sub">Each step identifies what your institution needs to do and what Hazel is reviewing.</p>')+card("Designed for control",'<p class="sub">Role-based tasks, document requests, approvals, and go-live controls keep progress visible.</p>')+'</div></section></main></div>'}
function field(id,label,type,value,span){return '<div class="field '+(span?'span-2':'')+'"><label for="'+id+'">'+esc(label)+' <span class="required">*</span></label><input class="input" id="'+id+'" name="'+id+'" type="'+(type||'text')+'" value="'+esc(value||'')+'" required></div>'}
function interest(){return '<div class="auth"><main id="main" class="auth-card"><p class="eyebrow">For regulated institutions</p><h1>Express interest</h1><p class="lead">This creates an inquiry only. It does not create a portal account or show eligibility screening.</p><form id="interest-form" style="margin-top:25px"><div class="form-grid">'+field("legal","Legal institution name","text","Northstar Community Bank, N.A.")+field("fdic","FDIC certificate number","text","12001")+field("website","Institution website","url","https://northstar.example")+'<div class="field"><label for="type">Institution type <span class="required">*</span></label><select class="input" id="type" required><option>National bank</option><option>State member bank</option><option>State nonmember bank</option></select></div>'+field("contact","Contact name","text","Jamie Chen")+field("title","Role / title","text","Chief Operating Officer")+field("email","Business email","email","jamie.chen@northstar.example")+field("phone","Phone","tel","(555) 010-0200")+'<div class="field span-2"><label for="reason">Reason for interest <span class="muted small">Optional</span></label><textarea class="input" id="reason">Explore Hazel for tokenized deposits, settlement services, and modern payment infrastructure.</textarea></div><label class="choice span-2"><input type="checkbox" id="consent" checked required><span>I consent to being contacted by Hazel about this inquiry.</span></label></div><button class="btn primary" type="submit">Submit interest</button><p class="hint">Prototype only · no information leaves this browser.</p></form></main></div>'}
function thankYou(){return '<div class="auth"><main id="main" class="auth-card"><div class="success-mark">✓</div>'+status("Interest received","success")+'<h1 style="margin-top:16px">Thank you.</h1><p class="lead">Hazel will review your institution’s eligibility and contact the approved representative with next steps.</p><div class="alert"><strong>Reference HZL-INT-2026-1048</strong><br>No portal account has been created. Hazel’s institution and eligibility review occurs privately.</div><div class="actions">'+btn("Return to Hazel Network","nav:landing","secondary")+'</div></main></div>'}
function invitation(){const c=currentCase(),mode=c.invite;let title="You’re invited to continue with Hazel",copy="This secure invitation is associated with one institution and one approved representative.",tone="success";if(mode!=="valid"&&mode!=="accepted"){title=mode==="expired"?"This invitation has expired":mode==="revoked"?"This invitation was revoked":"We couldn’t match this invitation";copy="Contact your Hazel representative for a new invitation or assistance.";tone="warning"}return '<div class="auth"><main id="main" class="auth-card">'+status(mode==="valid"?"Secure invitation":mode,tone)+'<h1 style="margin-top:16px">'+esc(title)+'</h1><p class="lead">'+esc(copy)+'</p>'+(mode==="valid"||mode==="accepted"?'<div class="card" style="margin-top:24px"><h3>Northstar Community Bank, N.A.</h3><div class="task-list"><div class="task"><span class="task-icon">•</span><div><strong>Invited contact</strong><p>Jamie Chen · Chief Operating Officer</p></div></div><div class="task"><span class="task-icon">•</span><div><strong>Approved email</strong><p>jamie.chen@northstar.example</p></div></div><div class="task"><span class="task-icon">•</span><div><strong>Expiration</strong><p>August 15, 2026 at 5:00 PM ET</p></div></div></div><div class="actions">'+btn(mode==="accepted"?"Continue to portal":"Accept and continue","nav:register","primary")+btn("Preview invitation states","invite-state","quiet")+'</div></div>':'<div class="actions">'+btn("Enter a different invitation","invite-state","secondary")+btn("Request assistance","help","primary")+'</div>')+'</main></div>'}
function register(){return '<div class="auth"><main id="main" class="auth-card">'+status("Invitation accepted","success")+'<h1 style="margin-top:16px">Create your Hazel access</h1><p class="lead">You’ll become the primary portal administrator for Northstar Community Bank.</p><form id="register-form" style="margin-top:24px"><div class="form-grid">'+field("rname","Full name","text","Jamie Chen")+field("rtitle","Title / role","text","Chief Operating Officer")+field("remail","Work email","email","jamie.chen@northstar.example")+'<div class="field"><label for="institution">Institution</label><input class="input" id="institution" value="Northstar Community Bank" readonly></div>'+field("password","Create password","password","")+'<div class="field"><label for="idp">Identity method</label><select id="idp" class="input"><option>Password + MFA</option><option>Organization identity provider (mock)</option></select></div></div><div class="alert"><strong>MFA enrollment</strong><br>Select a factor for this demonstration. The invitation code is not your permanent login credential.</div><label class="choice"><input type="radio" name="mfa" checked><span>Authenticator application</span></label><label class="choice"><input type="radio" name="mfa"><span>Verified mobile number</span></label><label class="choice"><input type="checkbox" checked required><span>I acknowledge the Terms of Use and Privacy Notice.</span></label><button class="btn primary" type="submit">Create secure account</button></form></main></div>'}
function tracker(){const current=!state.ndaCompleted?2:!state.dueDiligenceSubmitted?3:!state.riskQuestionsSubmitted?4:5;return '<div class="tracker" aria-label="Onboarding progress">'+MEMBER_STAGES.map((x,i)=>'<div class="track '+(i<current?'done':i===current?'current':'')+'"><div class="track-bar"></div><label>'+x+'</label></div>').join('')+'</div>'}
function memberDashboard(){const next=!state.ndaCompleted?"Review and sign the Mutual NDA":!state.dueDiligenceSubmitted?"Complete Due Diligence":!state.riskQuestionsSubmitted?"Continue Risk Questions":"Hazel is reviewing your information",action=!state.ndaCompleted?"nav:nda":!state.dueDiligenceSubmitted?"nav:due-diligence":!state.riskQuestionsSubmitted?"nav:risk-questions":"nav:review-status";return shell(head("Member onboarding","Welcome back, Northstar Community Bank","Hazel contact: Avery Morgan · onboarding@hazel.example",status(STAGES[state.stage]||"NDA","info"))+card("Your onboarding journey",tracker()+'<p class="sub">Due Diligence unlocks after the NDA is signed. Risk Questions unlock after Due Diligence is submitted.</p>')+'<div class="grid grid-2"><div>'+card("Action required from your institution",'<div class="task"><span class="task-icon">1</span><div><strong>'+esc(next)+'</strong><p>Save and return at any time.</p></div>'+btn(state.riskQuestionsSubmitted?"View status":"Continue",action,"primary")+'</div>')+card("Stage access",'<div class="task '+(state.ndaCompleted?'complete':'')+'"><span class="task-icon">'+(state.ndaCompleted?'✓':'•')+'</span><div><strong>NDA</strong><p>'+(!state.ndaCompleted?'Action required before forms become available':'Signed successfully')+'</p></div>'+status(state.ndaCompleted?"Completed":"Action required",state.ndaCompleted?"success":"warning")+'</div><div class="task '+(state.dueDiligenceSubmitted?'complete':'')+'"><span class="task-icon">'+(state.dueDiligenceSubmitted?'✓':'•')+'</span><div><strong>Due Diligence</strong><p>'+(!state.ndaCompleted?'Complete the NDA before continuing.':state.dueDiligenceSubmitted?'Submitted':'Available')+'</p></div>'+status(!state.ndaCompleted?"Locked":state.dueDiligenceSubmitted?"Completed":"In progress",state.dueDiligenceSubmitted?"success":state.ndaCompleted?"info":"warning")+'</div><div class="task '+(state.riskQuestionsSubmitted?'complete':'')+'"><span class="task-icon">'+(state.riskQuestionsSubmitted?'✓':'•')+'</span><div><strong>Risk Questions</strong><p>'+(!state.dueDiligenceSubmitted?'Complete Due Diligence before starting Risk Questions.':state.riskQuestionsSubmitted?'Submitted':'Available')+'</p></div>'+status(!state.dueDiligenceSubmitted?"Locked":state.riskQuestionsSubmitted?"Submitted":"In progress",state.riskQuestionsSubmitted?"success":state.dueDiligenceSubmitted?"info":"warning")+'</div>')+'</div><aside>'+card("Institution profile",'<div class="task-list"><div class="task"><div><strong>Legal name</strong><p>Northstar Community Bank, N.A.</p></div></div><div class="task"><div><strong>FDIC certificate</strong><p>12001 · authoritative identifier</p></div></div></div>'+btn("View profile","profile-modal","secondary"))+card("Recent activity",'<div class="audit"><span class="muted">Today</span><div><strong>'+esc(next)+'</strong><br><span class="muted">Current next action</span></div></div>')+'</aside></div>',false)}

 const completed=assessment.status==="Completed";
 return card("Coverbase Assessment",
  '<div class="alert warning"><strong>Internal only.</strong><br>Synthetic prototype data. Do not share the score, risk band, findings, or exception logic with the member bank.</div>'+
  '<div class="case-facts"><div class="case-fact"><span>Assessment status</span><strong>'+esc(assessment.status)+'</strong></div><div class="case-fact"><span>Initial risk score</span><strong>'+esc(assessment.initialRiskScore)+' / 100</strong></div><div class="case-fact"><span>Risk band</span><strong>'+esc(assessment.riskBand)+'</strong></div><div class="case-fact"><span>Open findings</span><strong>'+esc(assessment.openFindings)+'</strong></div><div class="case-fact"><span>Exception review</span><strong>'+esc(assessment.exceptionReview)+'</strong></div><div class="case-fact"><span>Assessment timestamp</span><strong>'+esc(assessment.assessedAt||"Pending")+'</strong></div></div>'+
  '<p class="hint">Source: Coverbase assessment · synthetic prototype data</p>'+
  '<div class="actions">'+btn("Record in-parameter outcome","coverbase-in-parameter","primary")+btn("Require exception review","coverbase-exception","secondary")+(completed&&assessment.exceptionReview==="Triggered"?btn("Record clarification reviewed","coverbase-clarification-reviewed","quiet"):"")+'</div>'
 );
}
const july27CaseTabs=caseTabs;
caseTabs=function(){
 const tabs=["overview","rafa","due diligence","risk questions","documents","coverbase assessment","approval","integration","audit"];
 return '<nav class="tabs">'+tabs.map(tab=>'<button class="tab '+(state.caseTab===tab?"active":"")+'" data-case-tab="'+tab+'">'+tab.replace(/\b\w/g,char=>char.toUpperCase())+'</button>').join("")+'</nav>';
};
const july27OpsCase=opsCase;
opsCase=function(){
 if(state.caseTab!=="coverbase assessment")return july27OpsCase();
 return shell(head("Internal case","Northstar Community Bank","CASE-2026-1048 · synthetic stakeholder case",status("Internal detail","warning"))+caseTabs()+coverbaseAssessmentCard(),true);
};

const caseById=id=>CASES.find(item=>item.id===id);
Object.assign(caseById("nda-complete"),{name:"NDA completed / Documents unlocked",screen:"documents",stage:5});
Object.assign(caseById("required-documents"),{name:"Required Documents in progress",screen:"documents",stage:5});
Object.assign(caseById("document-processing"),{name:"Required Documents accepted / Due Diligence unlocked",screen:"due-diligence",stage:6});
Object.assign(caseById("submitted"),{name:"Submitted / Coverbase assessment running",stage:8});
Object.assign(caseById("complete"),{name:"Hazel Review complete / Account Opening unlocked",stage:9,outcome:"Approved"});
if(!caseById("prelim-progress"))CASES.splice(CASES.findIndex(item=>item.id==="deferred"),0,
 {id:"prelim-progress",name:"Prelim Account Opening in progress",view:"member",screen:"prelim",stage:9,rafa:"Eligible · composite 1",invite:"accepted",nda:"COMPLETED",ndaDone:true,ddDone:true,riskDone:true,outcome:"Approved"}
);

setCase=function(id){
 if(preparationTimer)clearTimeout(preparationTimer);preparationTimer=null;
 if(submissionTimer)clearTimeout(submissionTimer);submissionTimer=null;
 const selected=caseById(id)||CASES[0];
 state=defaultState();
 state.caseId=selected.id;state.view=selected.view;state.screen=selected.screen;state.stage=selected.stage;state.ndaStatus=selected.nda;state.ndaCompleted=selected.ndaDone;
 state.ndaCompletedAt=selected.ndaDone?TODAY_LABEL+" at 10:42 AM ET":"";state.dueDiligenceSubmitted=selected.ddDone;state.riskQuestionsSubmitted=selected.riskDone;state.outcome=selected.outcome;
 normalizeHeadlessState();normalizeWorkflowState();
 const documentsAccepted=["document-processing","diligence","risk","submitted","additional","complete","prelim-progress"].includes(selected.id)||selected.ddDone;
 if(selected.id==="required-documents"){
  const cbdq=state.ddDocuments.cbdq;cbdq.status="STORED";cbdq.progress=68;cbdq.version=1;cbdq.history=[{version:1,fileName:"Northstar-Wolfsberg-CBDDQ.pdf",date:TODAY_LABEL,status:"Uploaded · processing"}];
 }
 if(documentsAccepted)Object.values(state.ddDocuments).forEach(doc=>{doc.status="ACCEPTED";doc.progress=100;doc.version=1;doc.history=[{version:1,fileName:doc.id==="cbdq"?"Northstar-Wolfsberg-CBDDQ.pdf":"Northstar-BSA-AML-OFAC-Policy.pdf",date:TODAY_LABEL,status:"Accepted"}]});
 if(selected.ddDone)seedIntegrationIds();
 if(selected.id==="submitted"){state.coverbaseAssessment.status="Running";state.coverbaseAssessment.assessedAt=null;setIntegration("ASSESSMENT_IN_PROGRESS","Synthetic Coverbase assessment started")}
 if(selected.id==="additional"){
  state.reviewOutcome="Additional information required";state.clarification.active=true;state.clarification.documentStatus="RESUBMISSION_REQUIRED";
  state.coverbaseAssessment=Object.assign(state.coverbaseAssessment,{status:"Completed",openFindings:1,exceptionReview:"Triggered",assessedAt:TODAY_LABEL+" at 2:06 PM ET"});
  setIntegration("CLARIFICATION_REQUIRED","Internal exception review requested additional information");
 }
 if(["complete","prelim-progress"].includes(selected.id)){
  state.reviewOutcome="Approved";state.outcome="Review complete";state.accountReserved=selected.id==="prelim-progress";state.packageStep=selected.id==="prelim-progress"?1:0;
  state.coverbaseAssessment=Object.assign(state.coverbaseAssessment,{status:"Completed",openFindings:0,exceptionReview:"Not triggered",assessedAt:TODAY_LABEL+" at 2:18 PM ET"});
  setIntegration("REVIEW_COMPLETE","Hazel approval recorded");
 }
 if(selected.view==="operator"){
  state.caseTab="coverbase assessment";state.coverbaseAssessment=Object.assign(state.coverbaseAssessment,{status:"Completed",openFindings:1,exceptionReview:"Triggered",assessedAt:TODAY_LABEL+" at 2:06 PM ET"});
 }
 save();location.hash=state.screen;render();scrollTo(0,0);
};

const july27Handle=handle;
handle=function(action,el){
 if(action==="finish-signing"){
  state.ndaStatus="COMPLETED";state.ndaCompleted=true;state.ndaCompletedAt=integrationTime();state.stage=5;
  state.audit.unshift({time:"Just now",action:"NDA completed",actor:"Jamie Chen"});state.memberActivity.unshift({time:"Just now",event:"NDA completed"});
  save();closeModal();render();ndaConfirmation();toast("Signed NDA received. Required Documents are now available.");return;
 }
 if(action==="nda-continue"){closeModal();navigate("documents","member",5);return}
 if(action==="coverbase-in-parameter"){
  state.coverbaseAssessment=Object.assign(state.coverbaseAssessment,{status:"Completed",openFindings:0,exceptionReview:"Not triggered",assessedAt:integrationTime()});
  state.reviewOutcome="Approved";state.outcome="Review complete";state.riskQuestionsSubmitted=true;setIntegration("REVIEW_COMPLETE","In-parameter Coverbase result approved by Hazel");save();render();toast("Institution approved; Account Opening unlocked");return;
 }
 if(action==="coverbase-exception"){
  state.coverbaseAssessment=Object.assign(state.coverbaseAssessment,{status:"Completed",openFindings:1,exceptionReview:"Triggered",assessedAt:integrationTime()});
  state.riskQuestionsSubmitted=true;state.reviewOutcome="Additional information required";state.outcome="Additional information required";
  state.clarification.active=true;state.clarification.response="";state.clarification.responseSubmittedAt=null;state.clarification.documentStatus="RESUBMISSION_REQUIRED";
  state.memberActivity.unshift({time:"Just now",event:"Additional information requested by the Hazel Review Team"});
  setIntegration("CLARIFICATION_REQUIRED","Internal exception review requested additional information");save();render();toast("Exception review recorded; Account Opening remains locked");return;
 }
 if(action==="coverbase-clarification-reviewed"){
  state.coverbaseAssessment.openFindings=0;state.coverbaseAssessment.exceptionReview="Resolved after clarification";state.reviewOutcome="Approved";state.outcome="Review complete";state.clarification.active=false;
  setIntegration("REVIEW_COMPLETE","Clarification reviewed and Hazel approval recorded");save();render();toast("Clarification reviewed; Account Opening unlocked");return;
 }
 if(action.startsWith("decision:")){
  const decision=action.slice(9);
  if(decision==="Approved"||decision==="Approved with conditions"){
   state.reviewOutcome="Approved";state.outcome="Review complete";state.riskQuestionsSubmitted=true;state.coverbaseAssessment.status="Completed";state.coverbaseAssessment.openFindings=0;state.coverbaseAssessment.exceptionReview="Not triggered";state.coverbaseAssessment.assessedAt=state.coverbaseAssessment.assessedAt||integrationTime();
   setIntegration("REVIEW_COMPLETE","Hazel approval decision recorded");save();render();toast("Institution approved; Account Opening unlocked");return;
  }
  if(decision==="More information required"){
   state.coverbaseAssessment.openFindings=Math.max(1,state.coverbaseAssessment.openFindings);state.coverbaseAssessment.exceptionReview="Triggered";
   state.riskQuestionsSubmitted=true;state.reviewOutcome="Additional information required";state.outcome="Additional information required";state.clarification.active=true;state.clarification.documentStatus="RESUBMISSION_REQUIRED";
   setIntegration("CLARIFICATION_REQUIRED","Hazel reviewer requested additional information");save();render();toast("Information request recorded; Account Opening remains locked");return;
  }
 }
 return july27Handle(action,el);
};

const july27Bind=bind;
bind=function(){
 july27Bind();
 const viewSelect=document.getElementById("view-select");
 if(viewSelect)viewSelect.onchange=event=>{
  state.view=event.target.value;
  state.screen=state.view==="public"?"landing":state.view==="member"?"member-dashboard":"ops-dashboard";
  if(state.view==="operator")state.caseTab=state.caseTab||"coverbase assessment";
  save();location.hash=state.screen;render();
 };
 const setup=document.getElementById("setup-form");
 if(setup)setup.onsubmit=event=>{event.preventDefault();navigate("prelim","member",9);toast("Account setup information saved. Prelim is ready.")};
};
function viewSignedNda(){
 modal("Completed Mutual Non-Disclosure Agreement",
  '<div class="doc-preview"><strong>Hazel Network Mutual Non-Disclosure Agreement</strong><p class="sub">Prototype completed copy</p><div class="doc-lines"></div><div class="doc-lines"></div><div class="doc-lines"></div><div class="doc-lines"></div><div class="doc-lines"></div></div><div class="alert success"><strong>Completed</strong><br>Signed by Jamie Chen · '+esc(state.ndaCompletedAt||TODAY_LABEL)+'</div>',
  btn("Close","close-modal","secondary")
 );
}
function downloadSignedNda(){
 const content=[
  "HAZEL NETWORK MUTUAL NON-DISCLOSURE AGREEMENT",
  "PROTOTYPE COMPLETED COPY — NOT A LEGAL DOCUMENT",
  "",
  "Institution: Northstar Community Bank, N.A.",
  "Signed by: Jamie Chen",
  "Completed: "+(state.ndaCompletedAt||TODAY_LABEL),
  "",
  "This simulated download is provided only for prototype review."
 ].join("\n");
 const url=URL.createObjectURL(new Blob([content],{type:"text/plain;charset=utf-8"}));
 const link=document.createElement("a");
 link.href=url;link.download="Hazel-Network-Mutual-NDA-PROTOTYPE.txt";
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),0);
 toast("Prototype NDA download started");
}
const july28Handle=handle;
handle=function(action,el){
 if(action==="view-signed"){viewSignedNda();return}
 if(action==="download-signed"){downloadSignedNda();return}
 return july28Handle(action,el);
};
render=function(){
 normalizeHeadlessState();normalizeWorkflowState();
 let html;
 const requested=(location.hash||"#"+state.screen).slice(1);
 const screen=guardRoute(requested,true);
 if(screen!==requested)history.replaceState(null,"","#"+screen);
 state.screen=screen;
 controls();
 switch(state.screen){
  case"landing":html=landing();break;
  case"interest":html=interest();break;
  case"thank-you":html=thankYou();break;
  case"invitation":html=invitation();break;
  case"register":html=register();break;
  case"member-dashboard":html=memberDashboard();break;
  case"nda":html=nda();break;
  case"documents":html=documents();break;
  case"due-diligence":html=dueDiligenceIntake();break;
  case"preparing-risk":html=preparingRiskQuestions();break;
  case"risk-questions":html=riskQuestions();break;
  case"review-submit":html=reviewSubmit();break;
  case"submitting":html=submissionScreen();break;
  case"review-status":html=reviewStatus();break;
  case"clarification":html=clarification();break;
  case"account-setup":html=accountSetup();break;
  case"prelim":html=prelim();break;
  case"ops-dashboard":html=opsDashboard();break;
  case"ops-queue":html=opsQueue();break;
  case"ops-case":html=opsCase();break;
  default:html=state.view==="operator"?opsDashboard():state.view==="member"?memberDashboard():landing();
 }
 document.getElementById("app").innerHTML=html;
 bind();save();
 if(state.screen==="preparing-risk"&&coverbaseIntegration.status!=="SYNC_FAILED")runPreparation();
};
window.addEventListener("hashchange",()=>{const s=location.hash.slice(1);if(s&&s!==state.screen){state.screen=s;render()}});
render();
})();
</script>
</body>
